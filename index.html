<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      ONE MARK, THE PRISM APP-ICON TILE.

      TikTok rejected the app on 2026-09-15 with: "The app icon submitted in the
      Basic Info does not match the icon displayed on the website. Please ensure
      the same icon is used consistently across both the TikTok, the website and
      Browser tab (favicon)". So all three are rendered from one source.

      THE SQUARE TILE, NOT THE BARE `i`. The kit is explicit: "Icon 16px tall;
      below that, use the app icon tile." The `i` glyph is 40x96, so in a 16px
      browser tab it was a sliver with most of its box empty.

      THE LIGHT TILE, NOT THE INK ONE, and that is a contrast decision rather
      than a taste one. Chrome's dark tab strip is #202124 and the ink tile's
      ground is #14141C: side by side at 16px the icon simply disappears into
      the strip, which is what Rashid saw. The white tile reads on both strips,
      because the ink triangle and the spectrum stripe carry it either way.
      Rendered both at tab size against both strips before choosing.

      The PNG is for browsers and link previews that ignore SVG favicons;
      /tiktok-app-icon.png (1024px) is the file uploaded to TikTok, rendered
      from the LIGHT tile because theirs is specified on white.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <!--
      AND A REAL .ico. Browsers ask for /favicon.ico whether or not a page links
      one, and this is a single-page app: every unknown path is rewritten to
      index.html, so that request was answering with 4KB of HTML labelled
      `text/html`. Harmless in a tab, not harmless everywhere â€” the vendored
      Paid Collabs code uses `/favicon.ico` as its desktop-notification icon,
      which was therefore a broken image. 16, 32 and 48px, same PRISM tile.
    -->
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <title>Prism | See your true TikTok Shop results.</title>
    <meta
      name="description"
      content="The creator platform behind Wurx Media's TikTok Shop brands. Real GMV, real commission and real leaderboards, with one login for every brand you work with."
    />
    <!-- PRISM Ink. Was #0a0a0a, the old Wurx near-black. -->
    <meta name="theme-color" content="#14141c" />
    <meta name="robots" content="noindex" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Prism | See your true TikTok Shop results." />
    <meta
      property="og:description"
      content="The creator platform behind Wurx Media's TikTok Shop brands."
    />

    <!--
      Anti-flash theme script.

      This runs BEFORE the first paint and before React loads, so the page is
      already the right colour when it appears. Without it, a user on light mode
      would see a black page for a few hundred milliseconds, or vice versa.
      It must stay in sync with src/components/theme/ThemeProvider.tsx, same storage key, same fallback.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wurxmediahub-theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          document.documentElement.dataset.theme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', resolved === 'dark' ? '#14141c' : '#f7f7fb');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();

      /*
       * TIKTOK'S RETURN PARAMETERS ARE NOT SUPABASE'S, AND THE CLIENT CANNOT
       * TELL THE DIFFERENCE.
       *
       * `src/lib/supabase.ts` is built with `detectSessionInUrl: true` and
       * `flowType: 'pkce'`, so the moment that module loads it looks for a
       * `?code=` in the address and tries to exchange it for a session using
       * whatever PKCE verifier it has in storage. TikTok sends us back to
       * /oauth/tiktok/callback and /oauth/tiktok-creator/callback with exactly
       * that shape â€” `?code=...&state=...` â€” and the client will grab it.
       *
       * The React route already strips the address bar, but that runs in an
       * effect, long AFTER the client has been constructed. This has to happen
       * before the module graph loads at all, which is why it lives here beside
       * the theme script rather than in the app.
       *
       * The parameters are handed to the page on `window.__wxOAuthReturn`
       * instead, so nothing is lost â€” and they leave the address bar, the
       * referrer and the history entry at the same time.
       */
      (function () {
        try {
          var p = window.location.pathname;
          if (p !== '/oauth/tiktok/callback' && p !== '/oauth/tiktok-creator/callback') return;
          if (!window.location.search) return;
          var q = new URLSearchParams(window.location.search);
          window.__wxOAuthReturn = {
            /* The ads side returns `auth_code`, the creator side `code`. Both
               are captured, because missing one would silently strip a
               parameter the page still needs. */
            code: q.get('code') || q.get('auth_code'),
            state: q.get('state'),
            error: q.get('error'),
            error_description: q.get('error_description'),
            scopes: q.get('scopes'),
          };
          window.history.replaceState({}, '', p);
        } catch (e) {
          /* Leaving the query in place is the old behaviour, not a new fault. */
        }
      })();
    </script>

    <!--
      The two PRISM faces, self-hosted (no third party, no render-blocking CSS
      round trip). Preloaded so the swap from the fallback happens as early as
      it can, which is what keeps the headline from visibly re-flowing. Only
      the latin subsets: the latin-ext files are fetched on demand by
      unicode-range. `crossorigin` is required for font preloads.
    -->
    <link
      rel="preload"
      href="/fonts/figtree-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/caprasimo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
