<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      ONE MARK, THE DOG FACE, the same one wurxmedia.com wears.

      TikTok rejected the app on 2026-09-15 with: "The app icon submitted in the
      Basic Info does not match the icon displayed on the website. Please ensure
      the same icon is used consistently across both the TikTok, the website and
      Browser tab (favicon)". This tab wore an older geometric gold W.

      The PNG is for the browsers and link previews that ignore SVG favicons;
      /tiktok-app-icon.png (1024px, on white) is the file uploaded to TikTok,
      rendered from the same artwork.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <title>WurxMediaHub | Your numbers. Finally yours.</title>
    <meta
      name="description"
      content="The creator platform behind Wurx Media's TikTok Shop brands. Real GMV, real commission and real leaderboards, with one login for every brand you work with."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="robots" content="noindex" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="WurxMediaHub | Your numbers. Finally yours." />
    <meta
      property="og:description"
      content="The creator platform behind Wurx Media's TikTok Shop brands."
    />

    <!--
      Anti-flash theme script.

      This runs BEFORE the first paint and before React loads, so the page is
      already the right colour when it appears. Without it, a user on light mode
      would see a black page for a few hundred milliseconds, or vice versa.
      It must stay in sync with src/components/theme/ThemeProvider.tsx, same storage key, same fallback.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wurxmediahub-theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          document.documentElement.dataset.theme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', resolved === 'dark' ? '#0a0a0a' : '#faf8f3');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <!--
      No web fonts on purpose. Google Fonts cost 102 KB and a render-blocking
      round trip to a third party. The type stacks in src/styles/tokens.css use
      the faces already installed on the device.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
