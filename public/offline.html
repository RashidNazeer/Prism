<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism is offline</title>
    <meta name="theme-color" content="#14141c" />
    <!--
      THE ONE PLACE IN THIS PRODUCT WITH HARDCODED COLOUR, AND IT HAS TO BE.

      Every other surface takes its colour from `--wx-*` in tokens.css, which
      arrives in the app's stylesheet. This page is what a creator sees when
      the network is gone, which is exactly when that stylesheet cannot be
      fetched. A token here would resolve to nothing and the page would be
      black text on a black ground. So the values are inlined, copied from
      tokens.css: ink #14141c, mist #f7f7fb, subtle #b9b9c8, violet #9b5cff.

      Keep them in step by hand if the palette moves. There is no build step
      that can do it for a file that must stand entirely alone.
    -->
    <style>
      :root {
        color-scheme: dark light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #14141c;
        color: #ffffff;
        font-family:
          'Figtree',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 24rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      img {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.25rem;
      }
      h1 {
        margin: 0;
        font-size: 1.375rem;
        line-height: 1.2;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: #b9b9c8;
      }
      button {
        margin-top: 0.5rem;
        min-height: 44px;
        padding: 0 1.75rem;
        border: 0;
        border-radius: 999px;
        background: #9b5cff;
        color: #14141c;
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f7f7fb;
          color: #14141c;
        }
        p {
          color: #4a4a5a;
        }
        button {
          color: #ffffff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="192" height="192" />
      <h1>You are offline</h1>
      <p>
        Prism needs a connection to show your numbers, because they come from TikTok Shop rather
        than from this device. Nothing is lost.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
